[project]
name = "maxpar-srag"
version = "0.1.0"
description = "Análise SRAG 2023 (SIVEP-Gripe / Open Data SUS) — teste técnico Maxpar"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rodrigo" }]

# Dependências organizadas por finalidade.
# Por que pandas + polars: pandas é o ecossistema padrão de modelagem (sklearn);
# polars carrega o CSV de 300 MB ~10x mais rápido. Decidimos qual será a engine
# principal na FASE 1 (carregamento) — ambos ficam disponíveis até lá.
dependencies = [
    # Manipulação de dados
    "pandas>=2.2",
    "polars>=1.0",
    "numpy>=1.26",
    "pyarrow>=16.0",          # backend Parquet
    # Modelagem
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.1",
    "optuna>=3.6",            # tuning de hiperparâmetros
    "shap>=0.45",             # interpretabilidade
    "imbalanced-learn>=0.12", # SMOTE / undersampling para classe rara
    # Visualização
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
    "missingno>=0.5.2",       # análise visual de missing values
    # Notebooks
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbformat>=5.10",
    # Utilitários
    "tqdm>=4.66",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maxpar_srag"]

# ---------------------------------------------------------------------------
# Linting / formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]  # line length controlado pelo formatter

# ---------------------------------------------------------------------------
# Testes
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
